name: Deploy SOAR Backend to GCP

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH to GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "==> Pindah ke direktori backend utama..."
            cd /home/gtnic/GTNIC_AI_AGENT/backend
            
            echo "==> Menarik update terbaru dari GitHub..."
            git pull origin main
            
            echo "==> Menjalankan Docker..."
            if sudo docker compose version >/dev/null 2>&1; then
              sudo docker compose -f docker-compose.soar.yml up -d --build --remove-orphans
            elif sudo docker-compose version >/dev/null 2>&1; then
              sudo docker-compose -f docker-compose.soar.yml up -d --build --remove-orphans
            else
              echo "ERROR: Docker Compose belum terinstall di server GCP ini!"
              exit 1
            fi
            
            echo "==> Membersihkan cache Docker..."
            sudo docker image prune -f
            
            echo "==> Deployment selesai! Status kontainer:"
            sudo docker ps