name: Deploy SOAR Backend to GCP

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH to GCP
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "==> Navigating to SOAR project directory..."
            cd /home/gtnic/soar
            
            echo "==> Pulling latest changes from main..."
            git pull origin main
            
            echo "==> Melacak lokasi docker-compose.soar.yml otomatis..."
            COMPOSE_FILE=$(find /home/gtnic/soar -name "docker-compose.soar.yml" | head -n 1)
            
            if [ -z "$COMPOSE_FILE" ]; then
              echo "Error: docker-compose.soar.yml tidak ditemukan di dalam /home/gtnic/soar!"
              exit 1
            fi
            
            COMPOSE_DIR=$(dirname "$COMPOSE_FILE")
            echo "==> Pindah ke folder: $COMPOSE_DIR"
            cd "$COMPOSE_DIR"
            
            echo "==> Menjalankan Docker..."
            sudo docker-compose -f docker-compose.soar.yml up -d --build --remove-orphans
            
            echo "==> Membersihkan cache Docker..."
            sudo docker image prune -f
            
            echo "==> Deployment selesai! Status kontainer:"
            sudo docker ps