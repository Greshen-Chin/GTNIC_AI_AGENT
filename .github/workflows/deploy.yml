name: Deploy SOAR Backend to GCP (Self-Hosted)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_lab:
        description: Archive incidents and reset the Juice Shop lab queue
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Deploy on GCP VM via Self-Hosted Runner
        run: |
          echo "==> Pindah ke direktori backend utama..."
          cd /home/gtnic/GTNIC_AI_AGENT/backend

          echo "==> Menarik perubahan terbaru dari branch main..."
          git fetch origin main
          git reset --hard origin/main

          echo "==> Membebaskan port layanan 8080 dan 3000..."
          # These host ports are reserved for soar-api and Juice Shop. Remove
          # stale Docker containers from earlier deployments that still own them.
          for port in 8080 3000; do
            owners="$(docker ps --filter "publish=${port}" --format '{{.ID}} {{.Names}}')"
            if [ -n "$owners" ]; then
              echo "Container Docker yang memakai port ${port}:"
              echo "$owners"
              container_ids="$(docker ps -q --filter "publish=${port}")"
              docker stop $container_ids
            fi
          done

          if command -v ss >/dev/null 2>&1; then
            for port in 8080 3000; do
              if ss -ltnH "sport = :${port}" | grep -q .; then
                echo "ERROR: Port ${port} masih dipakai proses host non-Docker:"
                ss -ltnp "sport = :${port}" || true
                exit 1
              fi
            done
          fi

          docker network inspect single-node_default >/dev/null 2>&1 || \
            docker network create single-node_default

          echo "==> Menjalankan Docker Compose SOAR..."
          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.soar.yml up -d --build --remove-orphans
          elif docker-compose version >/dev/null 2>&1; then
            docker-compose -f docker-compose.soar.yml up -d --build --remove-orphans
          else
            echo "ERROR: Docker Compose belum terinstall di server GCP ini!"
            exit 1
          fi

          echo "==> Membersihkan image lama yang tidak terpakai..."
          docker image prune -f

          echo "==> Status kontainer yang berjalan:"
          docker compose -f docker-compose.soar.yml ps

      - name: Archive and reset lab on explicit request
        if: inputs.reset_lab == true || contains(github.event.head_commit.message, '[reset-lab]')
        run: |
          cd /home/gtnic/GTNIC_AI_AGENT/backend
          docker compose -f docker-compose.soar.yml stop juice-log-forwarder soar-api
          trap 'docker compose -f docker-compose.soar.yml start soar-api juice-log-forwarder' EXIT
          docker compose -f docker-compose.soar.yml run --rm --no-deps -T -e POSTGRES_HOST=postgres -e POSTGRES_PORT=5432 juice-log-forwarder python -m app.reset_lab --confirm RESET_LAB

      - name: Verify background ingestion is running
        run: |
          for attempt in $(seq 1 30); do
            if docker exec soar-api python -c "import json, urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert h.get('ingestion_mode') == 'persist-first-background-investigation', h; assert h.get('detector_version') == 'context-signatures-v1', h; assert h.get('investigation_worker_alive') is True, h; from app.services.detection_evaluation import evaluate_detector; e=evaluate_detector(); assert e['total_scenarios'] > 0 and e['correct'] == e['total_scenarios'], e; print('Background ingestion ready; labelled detector cases passed')"; then
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Backend baru atau worker investigasi belum siap."
          exit 1
