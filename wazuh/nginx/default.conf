log_format juice_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,'
  '"user_agent":"$http_user_agent","request_time":$request_time}';

server {
  listen 80;
  access_log /var/log/nginx/access.jsonl juice_json;
  location / {
    proxy_pass http://juice-shop:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
