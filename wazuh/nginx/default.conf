log_format juice_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"cf_connecting_ip":"$http_cf_connecting_ip","x_forwarded_for":"$http_x_forwarded_for",'
  '"method":"$request_method","uri":"$request_uri","body":"$request_body","status":$status,'
  '"bytes_sent":$bytes_sent,"user_agent":"$http_user_agent","request_time":$request_time}';

server {
  listen 80;
  access_log /var/log/nginx/access.jsonl juice_json;

  # Restore real client IP from Cloudflare or internal Docker reverse proxies
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Buffer request body in memory so $request_body is captured in access_log
  client_body_buffer_size 128k;
  client_max_body_size 10m;

  location / {
    proxy_pass http://juice-shop:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
