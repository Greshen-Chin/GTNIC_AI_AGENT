services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: soar-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soar_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HackWithGoh}
      POSTGRES_DB: ${POSTGRES_DB:-soar_db}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - single-node_default
    mem_limit: 512m

  soar-api:
    build: .
    container_name: soar-api
    restart: always
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      - postgres
    networks:
      - single-node_default
    mem_limit: 256m

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: soar-juice-shop
    restart: unless-stopped
    networks:
      - single-node_default

  juice-shop-proxy:
    image: nginx:1.27-alpine
    container_name: soar-juice-shop-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ../wazuh/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - juice_shop_logs:/var/log/nginx
    depends_on:
      - juice-shop
    networks:
      - single-node_default

  juice-log-forwarder:
    build: .
    container_name: soar-juice-log-forwarder
    restart: unless-stopped
    command: ["python", "-m", "app.services.juice_log_forwarder"]
    env_file:
      - .env
    environment:
      - SOAR_API_URL=http://soar-api:8000
      - JUICE_ACCESS_LOG=/var/log/nginx/access.jsonl
    volumes:
      - juice_shop_logs:/var/log/nginx:ro
      - juice_forwarder_state:/var/lib/juice-forwarder
    depends_on:
      - soar-api
      - juice-shop-proxy
    networks:
      - single-node_default

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.44.6}
    container_name: soar-n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=soar_admin
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-HackWithGoh}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
    networks:
      - single-node_default
    mem_limit: 768m

volumes:
  pg_data:
  n8n_data:
  juice_shop_logs:
  juice_forwarder_state:

networks:
  single-node_default:
    name: single-node_default
    external: true
